# Application name definition
spring.application.name=ai
# Logging pattern definition. Using this pattern I am going to display time information by using green color, log level by using blue color, thread name by using red color, actual logger message by using yellow color and message by using default color.
# Okay your application would still work without this property but I usually add this property for all kind of applications that I develop as it makes my life easy in understanding the logs as I try to display various pieces of information with different colors hence increasing the readability of my logs.
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

#spring.ai.openai.api-key=${OPENAI_API_KEY}

#If you ctrl + click on this "chat" property you will be able to visualize the details of this property. In the description of the property you can see that they clearly highlighted that by using this property we need to tell to the Spring AI framework what is the primary ChatModel to autoconfigure. If not set, each ChatModel model auto-configurations is enabled by default.
#Sometimes inside a Spring AI application, we may have multiple dependencies of ChatModels like openai, ollama, anthropic, etc. In such cases, by using this property we can tell/define which ChatModel should be the primary so that inside your Controller classes whenever you write the ChatClient kind of code like we have done in the ChatController, your ChatClient is not going to have any confusion about which ChatModel to use.
#For our application so far, mentioning this property is completely optional since we are only using Ollama based LLM model/ChatModel. Similarly, for other vendors you need to assign respective value i.e., openai, anthropic, etc. Like this for the valid values you can check inside the official documentation. Just mentioned it for your reference.
#spring.ai.model.chat=ollama

#By default, it is going to use the base url localhost:11434. This is the port where local LLMs are going to start inside our system. Since it is a default value, no need to define/mention this property.
#spring.ai.ollama.base-url=http://localhost:11434

#By using this, we need to tell to the Spring AI framework which specif LLM model I am running inside my local system. Which in our case is llama3.2:1b. 1b means nothing but 1 billion parameters. This is the exact LLM model that we are running inside our system.
#spring.ai.ollama.chat.model=llama3.2

#The reason on why we should add openai related dependency for docker based LLM models is - the Spring AI team decided to re-use the same openai related API for the docker based LLM models as well.
#we have spring.ai.ollama.chat.model=llama3.2 where we define/mention the model details. This time if we don't provide the model details - by default the OpenAI library is going to consider OpenAI related model as the default model, but we don't want that to happen instead we want the framework to consider our own LLM model which is running inside our local system. Since we are using openai dependency, in the property spring.ai.ollama.chat.model= <Value> key, instead of "ollama" we have to type/substitute that with "openai" so that it is spring.ai.openai.chat.model=<value> This time the value we need to mention the gemma3 model name that we downloaded i.e., ai/gemma3:4b-q4_K_M
#spring.ai.openai.chat.model=ai/gemma3:4b-q4_K_M

# We need to mention/define the base url. If you don't set the base url property then by default the openai dependency is going to consider the openai base url as the default base url. We don't want that to happen, we want the framework to consider docker based LLM model base url. The property that we need to therefore define is spring.ai.openai.chat.base-url. To this we need to mention/define a value http://localhost:12434/engines/v1. This is the place where the docker based LLM models are going to start inside our local system.
# Inside the Spring AI documentaion you will see that they recommended to mention this value up to the /engines i.e., http://localhost:12434/engines but that is a defect and we have to mention up to /v1 i.e., http://localhost:12434/engines/v1. If it works then that is fine otherwise in future if it doesn't work due to some upgrade reasons stick to the documentation recommended value i.e., http://localhost:12434/engines.
# If the below value is not working, try setting the base URL to http://localhost:12434/engines
#spring.ai.openai.chat.base-url=http://localhost:12434/engines/v1

#we need to mention is spring.ai.openai.api-key - this property we set it up when we integrated our Spring AI application with the openai based LLM model. But right now we are not trying to integrate with the openai based LLM model. But still why do we need to mention this property? Reason: Since we are using the same openai library/dependency even for the docker based LLM models, inside the library it is developed in such a way that during the start-up it is going to look for this property and its value as a mandatory check. So, that's why what Spring AI team recommend as of today is, they are asking us to mention some dummy value, we don't have to mention the actual openai secret key. So that should solve the problem around the api-key.
#spring.ai.openai.api-key= dummy

#Bedrock
#By using this region property we are trying to provide our region. This value should be same as to that where you are trying to access the bedrock. If you search for bedrock in the console you should be able in the top RHS see that. In my case Europe(Stockholm) and for this you can see the value being eu-north-1. So based upon the region that you selected, the region value you need to populate here. Reason: For different regions the LLM model id will be different and that is what you are going to mention for the property spring.ai.bedrock.converse.chat.model
#spring.ai.bedrock.aws.region=${AWS_REGION}
# Next we need to set the access key and secret key. Instead of providing the values directly, I am trying to inject them by using these environment variables.
#spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY}
#spring.ai.bedrock.aws.secret-key=${AWS_SECRET_KEY}
#By using this property we are telling to the Spring AI framework that we want to leverage Bedrock related Chat model.
#spring.ai.model.chat=bedrock-converse
#Telling to the Spring AI framework what is the LLM model that we are trying to interact with. To this property I am going to provide the value of the LLM model which is provided by my bedrock based upon my region. Where to get the value? Inside the Aws console in the bedrock page - on the LHS nav Infer >> Inference profiles. Under the page that comes up in the section "System-defined inference profiles" >> Under the search box, look for "model=Claude" - Nothing but we are looking for the model that has the name as Claude. Like this you should be able to see all Claude related models as of today. I will try to select the Sonnet related odel because "Opus" is costly and Haiku is very cheap. Like this under the search results I will select the Sonnet model 4.6. Make sure to always select the latest Sonnet model. Once you selected this - under the search results under the column "Inference profile ARN" copy the value to the record named "Global Anthropic Claude Sonnet 4.6". That is the value that you need to mention against to the property spring.ai.bedrock.converse.chat.model
#spring.ai.bedrock.converse.chat.model=arn:aws:bedrock:eu-north-1:504552747166:inference-profile/global.anthropic.claude-sonnet-4-6

#Multimodel
#By using this property we are mentioning the OpenAI API key using environment variable. This is very important because we want to interact with the OpenAI based LLM models that are deployed in some remote location.
spring.ai.openai.api-key=${OPENAI_API_KEY}
#By using this property we are trying to tell to the framework which specific LLM model that we are trying to run inside our local system by using Ollama. When you set this property please make sure that you have started this LLM model in your local system.
spring.ai.ollama.chat.model=llama3.2
#By default, for this property the framework is going to maintain true value. But when we are trying to use Multi models we need to set this property value to false. Reason: We want to stop one of the default behaviors of the Spring AI framework. We know that when we add a given LLM vendor dependency into our pom.xml file like openai or ollama, behind the scenes the framework is going to create the bean of ChatModel and using the same bean of ChatModel implementation it is also going to create a bean of ChatClient.builder. From the same we are going to create the bean of ChatClient and use the same inside our business logic. This is all the default behavior and this kind of set up will work perfectly when we have a single vendor LLM model dependency inside our class path. But right now since we have 2 different vendor LLM model dependencies inside our pom.xml or class path we don't want th framework to create the beans of ChatModels. Reason: If the framework has 2 beans of ChatModels it is going to have some confision as to which bean it has to consider as a primary bean when it is trying to create the bean of ChatClient.builder.
#So, to avoid all that confusion to the framework, we are setting this property value to false. Indirectly we are telling to the framework that don't try to create any kind of ChatClient.builder or ChatClient beans as I am going to create everything explicitly by myself. Your job is to only create the beans of Chat Models based upon the dependencies that we have inside the pom.xml.
spring.ai.chat.client.enabled=false
